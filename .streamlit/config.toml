# config.toml: the website's look (colors, font, rounded corners).
# Streamlit reads this automatically. Light and dark mode each get their own
# colors, and the chart colors were checked to be colorblind-safe in both.

[client]
# Hide Streamlit's "Deploy" button and developer menu.
toolbarMode = "minimal"

[server]
# Start right away without asking for an email address in the terminal.
headless = true

[browser]
gatherUsageStats = false

[theme]
# Inter, a clean modern font, loaded from Google Fonts (mentioned on the Privacy page).
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.75rem"
# Status colors (used for success/warning/error boxes and the arrows on number tiles)
greenColor = "#0ca30c"
yellowColor = "#fab219"
orangeColor = "#ec835a"
redColor = "#d03b3b"
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#3987e5", "#2a78d6", "#256abf", "#184f95", "#0d366b"]

[theme.light]
primaryColor = "#2a78d6"
blueColor = "#2a78d6"
backgroundColor = "#f6f6f3"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#f3f2ef"

[theme.dark]
primaryColor = "#3987e5"
blueColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#232322"
textColor = "#ffffff"
borderColor = "#383835"
dataframeBorderColor = "#383835"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#141413"
